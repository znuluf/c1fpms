<div class="modal-footer fpms-modal-footer">
    <button type="button" class="fpms-button fpms-button-secondary" [disabled]="cancelDisabled()" (click)="onCancelClick.emit($event)">
        {{ cancelLabel() }}
    </button>
    <button type="submit" class="fpms-button fpms-button-primary" [disabled]="saveDisabled()">
        {{ saveLabel() }}
    </button>
</div>
