<pagination-template #p="paginationApi" [id]="id" [maxSize]="maxSize" (pageChange)="pageChange.emit($event)">
    <nav class="fpms-pagination" [attr.aria-label]="screenReaderPaginationLabel">
        @if (!(autoHide && p.pages.length <= 1)) {
            <ul class="fpms-pagination-list">
                @if (directionLinks) {
                    <li class="fpms-pagination-item">
                        <button
                            type="button"
                            class="fpms-pagination-link"
                            [disabled]="p.isFirstPage()"
                            [attr.aria-label]="previousLabel"
                            (click)="p.previous()">
                            <i class="fas fa-chevron-left" aria-hidden="true"></i>
                        </button>
                    </li>
                }
                @for (page of p.pages; track page.label) {
                    <li class="fpms-pagination-item" [class.active]="p.getCurrent() === page.value">
                        <button
                            type="button"
                            class="fpms-pagination-link"
                            [attr.aria-current]="p.getCurrent() === page.value ? 'page' : null"
                            [attr.aria-label]="(p.getCurrent() === page.value ? screenReaderCurrentLabel + ' ' : '') + screenReaderPageLabel + ' ' + page.label"
                            (click)="p.setCurrent(page.value)">
                            {{ page.label }}
                        </button>
                    </li>
                }
                @if (directionLinks) {
                    <li class="fpms-pagination-item">
                        <button
                            type="button"
                            class="fpms-pagination-link"
                            [disabled]="p.isLastPage()"
                            [attr.aria-label]="nextLabel"
                            (click)="p.next()">
                            <i class="fas fa-chevron-right" aria-hidden="true"></i>
                        </button>
                    </li>
                }
            </ul>
        }
    </nav>
</pagination-template>
