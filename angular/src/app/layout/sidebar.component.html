<aside class="main-sidebar sidebar-light-primary no-print fpms-sidebar" (mouseover)="showTip($event)" (focusin)="showTip($event)" (mouseleave)="tip.set(null)" (focusout)="tip.set(null)">
    <div class="fpms-nav-card">
        <sidebar-logo></sidebar-logo>
        <div class="sidebar">
            <sidebar-menu></sidebar-menu>
        </div>
        <div class="fpms-nav-foot">
            <sidebar-user-panel></sidebar-user-panel>
            <a class="nav-link" [routerLink]="['/app/account']">
                <i class="nav-icon fas fa-user-cog" aria-hidden="true"></i><span>My account</span>
            </a>
            <a class="nav-link" [routerLink]="['/app/help']">
                <i class="nav-icon far fa-question-circle" aria-hidden="true"></i><span>Help</span>
            </a>
            <a class="nav-link fpms-signout" href="javascript:;" (click)="logout()">
                <i class="nav-icon fas fa-sign-out-alt" aria-hidden="true"></i><span>Sign out</span>
            </a>
            <!-- Collapse to icons and back (DEC-119); desktop widths only. -->
            <button type="button" class="nav-link fpms-nav-collapse" (click)="toggleMini()" [attr.aria-expanded]="!navMini()" [attr.aria-label]="navMini() ? 'Expand navigation' : 'Collapse navigation'">
                <i class="nav-icon fas" [class.fa-angle-double-left]="!navMini()" [class.fa-angle-double-right]="navMini()" aria-hidden="true"></i><span>{{ navMini() ? 'Expand' : 'Collapse' }}</span>
            </button>
        </div>
    </div>
    @if (tip(); as t) {
        <div class="fpms-nav-tip" role="tooltip" [style.top.px]="t.top">{{ t.text }}</div>
    }
</aside>
